; Sail serves the application with "artisan serve", so pages are handled by the
; CLI SAPI, where OPcache ships disabled. Without it every request recompiles the
; whole framework, which is by far the largest part of a page's cost.
opcache.enable_cli=1

; The project holds a little over 10 000 PHP files, above the 10 000 default:
; anything past the limit would be recompiled on every request.
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16

; The project lives on the WSL2 filesystem, where reading a file's date is cheap,
; so every request checks: an edit is served on the very next page, no delay.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
